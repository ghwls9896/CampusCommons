name: Request designated reviewer
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
permissions:
  pull-requests: write
concurrency:
  group: review-routing-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  request-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Runs only trusted base-branch code. Never check out or execute PR code here.
      - uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.state !== 'open' || pr.draft) return;
            const reviewer = pr.user.login.toLowerCase() === 'highchoi' ? 'ghwls9896' : 'HIGHCHOI';
            const alreadyRequested = (pr.requested_reviewers || []).some(
              user => user.login.toLowerCase() === reviewer.toLowerCase()
            );
            if (!alreadyRequested) {
              await github.rest.pulls.requestReviewers({
                owner, repo, pull_number, reviewers: [reviewer]
              });
            }
            core.info(`Designated reviewer: ${reviewer}. This requests review; it does not approve or merge.`);
