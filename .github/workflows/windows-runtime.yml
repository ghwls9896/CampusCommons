name: Windows study runtime
on:
  workflow_dispatch:
  push:
    branches: [chore/cc-42-release-cleanup]
    paths: [.github/workflows/windows-runtime.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Prepare and verify Windows runtime offline
        shell: pwsh
        run: |
          uv run --no-project --python 3.12.11 python Tools/distribution/prepare_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-runtime-windows-x64
          path: Assets/StreamingAssets/StudyRuntime/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
