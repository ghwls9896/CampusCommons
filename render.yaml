services:
  - type: web
    name: campuscommons-quiz
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: GEMINI_API_KEY
        sync: false
      - key: QUIZ_ACCESS_TOKEN
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DAILY_GENERATION_LIMIT
        value: 30
